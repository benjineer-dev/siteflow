name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://siteflow_test:siteflow_test@localhost:5433/siteflow_test?schema=public
  JWT_SECRET: test_only_jwt_secret_that_is_long_enough_for_siteflow
  JWT_ACCESS_TTL_SECONDS: "900"
  UPLOAD_DIR: storage/test-uploads

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Build applications
        run: pnpm build

  api-e2e:
    name: API e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test environment
        run: cp apps/api/.env.test.example apps/api/.env.test

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run API e2e tests
        run: pnpm --filter api test:e2e

      - name: Stop test database
        if: always()
        run: pnpm --filter api test:e2e:db:down
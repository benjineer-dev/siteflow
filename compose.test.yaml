services:
  postgres-test:
    image: postgres:17-alpine
    container_name: siteflow-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_USER: siteflow_test
      POSTGRES_PASSWORD: siteflow_test
      POSTGRES_DB: siteflow_test

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U siteflow_test -d siteflow_test",
        ]
      interval: 5s
      timeout: 5s
      retries: 10